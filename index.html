<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>taiga hagioda | Works & Portfolio</title>
    <style>
        /* フォント定義 & 基本スタイル */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            /* 日本語は明朝体、欧文・基本フォントは Othoro Pro */
            font-family: "Othoro Pro", "Yu Mincho", "游明朝", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", Georgia, "Times New Roman", serif;
            color: #222;
            background-color: #fafafa;
            line-height: 1.8;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ヘッダー */
        header {
            margin-bottom: 60px;
            border-bottom: 1px solid #e5e5e5;
            padding-bottom: 30px;
        }
        header h1 {
            font-family: "Othoro Pro", Georgia, serif;
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: lowercase;
        }
        header p.bio {
            margin-top: 12px;
            font-size: 0.95rem;
            color: #555;
            max-width: 650px;
        }

        /* 作品ギャラリー（2〜3列のグリッド） */
        .works-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 40px 30px;
        }

        .work-card {
            background: #fff;
            border: 1px solid #ececec;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .work-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.04);
        }

        .work-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
            background-color: #f5f5f5;
        }

        .work-card .content {
            padding: 24px;
        }

        .work-card .category {
            font-family: "Othoro Pro", Georgia, serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #888;
            margin-bottom: 8px;
        }
