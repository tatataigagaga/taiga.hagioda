<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>taiga hagioda | Works & Portfolio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Othoro Pro", "Yu Mincho", "游明朝", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
            color: #222;
            background-color: #fafafa;
            line-height: 1.8;
            padding: 40px 20px;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        header { margin-bottom: 60px; border-bottom: 1px solid #eee; padding-bottom: 30px; }
        header h1 { 
            font-size: 2rem; 
            font-weight: 400; 
            letter-spacing: 0.08em; 
            font-family: "Othoro Pro", "Yu Mincho", "游明朝", serif;
        }
        header p.bio { margin-top: 10px; font-size: 0.95rem; color: #666; }
        .works-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 40px 30px;
        }
        .work-card { background: #fff; border: 1px solid #f0f0f0; overflow: hidden; }
        .work-card img { width: 100%; height: 240px; object-fit: cover; display: block; background-color: #eee; }
        .work-card .content { padding: 20px; }
        .work-card .category { 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            color: #888; 
            margin-bottom: 5px; 
            font-family: "Othoro Pro", serif;
            letter-spacing: 0.1em;
        }
        .work-card h2 { font-size: 1.1rem; font-weight: 500; margin-bottom: 10px; }
        .work-card p { font-size: 0.88rem; color: #555; }
        footer { 
            margin-top: 80px; 
            padding-top: 30px; 
            border-top: 1px solid #eee; 
            font-size: 0.8rem; 
            color: #888; 
            text-align: center; 
            font-family: "Othoro Pro", "Yu Mincho", "游明朝", serif;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>taiga hagioda</h1>
            <p class="bio">建築、家具、造形、版画、タイポグラフィなど、素材や技法を横断した制作・研究活動を行っています。</p>
        </header>

        <main class="works-grid">
            <article class="work-card">
                <img src="tan korois.jpg" alt="タンコロイス">
                <div class="content">
                    <div class="category">Furniture / Timber</div>
                    <h2>タンコロイス</h2>
                    <p>山形県小国町にて、チェンソーを用いてブナの原木から直に削り出した立体家具作品。</p>
                </div>
            </article>

            <article class="work-card">
                <img src="logo.jpg" alt="LoGo Series">
                <div class="content">
                    <div class="category">Printmaking / Typography</div>
                    <h2>"LoGo" Series</h2>
                    <p>文字を物理的な素材として捉え、線の厚みや反転彫刻を試みた版画・タイポグラフィのシリーズ。</p>
                </div>
            </article>
        </main>

        <footer>
            <p>&copy; taiga hagioda. All Rights Reserved.</p>
        </footer>
    </div>
</body>
</html>
